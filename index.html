<style>
:root{
  --void:#0b0a0f;--void-2:#13121a;--ink:#1a1922;--ink-2:#22212c;
  --line:#2a2934;--line-soft:#1f1e28;
  --cream:#e6e1d6;--cream-dim:#a8a395;--cream-muted:#6e6a5e;
  --brass:#9a7a3a;--amber:#cc7a1f;--ox:#7a1818;--ox-2:#5a1212;
  --green:#3a9a5a;--red:#c43838;--blue:#4a7aa8;--yellow:#c89a28;
  --serif:Georgia,'Libre Baskerville',ui-serif,serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--void);color:var(--cream);font:14px/1.55 var(--sans);min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;background:transparent;border:none;color:inherit}
input,textarea,select{font-family:inherit;background:var(--ink);border:1px solid var(--line);color:var(--cream);border-radius:3px;padding:7px 10px;outline:none;font-size:13px}
input:focus,textarea:focus,select:focus{border-color:var(--brass)}
input[type=number]{font-family:var(--mono)}
a{color:var(--brass)}a:hover{color:var(--amber)}
textarea{min-height:80px;resize:vertical;font-family:var(--mono);font-size:12px}

.app{min-height:100dvh;display:grid;grid-template-rows:48px 1fr}
header{display:flex;align-items:center;border-bottom:1px solid var(--line);background:var(--void-2);user-select:none}
.brand{display:flex;align-items:center;gap:10px;padding:0 16px;height:100%;border-right:1px solid var(--line)}
.brand .mark{width:28px;height:28px;background:linear-gradient(135deg,var(--ox),var(--ox-2));border-radius:5px;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:16px;color:var(--cream)}
.brand .name{font-family:var(--serif);font-weight:600;font-size:14px;letter-spacing:0.02em}
.brand .seal{font-family:var(--mono);font-size:9px;color:var(--cream-muted);letter-spacing:0.18em;text-transform:uppercase}

.pt-pill{display:flex;align-items:center;gap:8px;padding:0 14px;height:100%;border-right:1px solid var(--line);cursor:pointer;font-size:12px;color:var(--cream-dim)}
.pt-pill:hover{background:var(--ink);color:var(--cream)}
.pt-pill .who{font-family:var(--serif);font-size:13px;color:var(--brass)}
.pt-pill .meta{font-family:var(--mono);font-size:9px;color:var(--cream-muted);letter-spacing:0.1em;text-transform:uppercase}

nav.tabs{display:flex;flex:1;overflow-x:auto;align-items:stretch}
nav.tabs button{padding:0 14px;font-size:12px;color:var(--cream-dim);letter-spacing:0.04em;display:flex;align-items:center;gap:6px;border-right:1px solid var(--line-soft);height:100%;white-space:nowrap;border-top:2px solid transparent}
nav.tabs button:hover{background:var(--ink);color:var(--cream)}
nav.tabs button.active{background:var(--ink);color:var(--brass);border-top-color:var(--ox)}

.tools-r{display:flex;align-items:center;gap:5px;padding:0 14px;height:100%;border-left:1px solid var(--line)}
.tool-btn{padding:5px 11px;border-radius:3px;font-size:11px;color:var(--cream-dim);letter-spacing:0.06em;text-transform:uppercase;font-family:var(--mono);border:1px solid var(--line)}
.tool-btn:hover{background:var(--ink);color:var(--cream);border-color:var(--brass)}
.tool-btn.primary{background:var(--ox);color:var(--cream);border-color:var(--ox);font-weight:600}
.tool-btn.primary:hover{background:var(--ox-2);border-color:var(--ox-2)}

.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100dvh - 48px)}
aside.sidebar{background:var(--void-2);border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px 60px;display:flex;flex-direction:column;gap:10px}
.sidebar h4{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:6px;padding:0 4px}
.sidebar-search{display:flex;flex-direction:column;gap:6px}
.sidebar-search input,.sidebar-search select{font-size:12px;padding:6px 8px}
.pt-list{display:flex;flex-direction:column;gap:3px}
.pt-card{padding:9px 11px;border-radius:3px;cursor:pointer;border:1px solid transparent;border-left:3px solid var(--line);background:var(--ink);transition:all 0.1s}
.pt-card:hover{background:var(--ink-2);border-left-color:var(--ox)}
.pt-card.active{background:var(--ink-2);border-left-color:var(--ox);border-color:var(--line)}
.pt-card .nm{font-family:var(--serif);font-size:13px;color:var(--cream);font-weight:600}
.pt-card .sub{font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.06em;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.pt-card .sub .tag{padding:1px 5px;border-radius:2px;background:var(--void);color:var(--cream-dim);font-size:9px}
.pt-card .sub .tag.due{background:var(--ox);color:var(--cream)}
.pt-card .sub .tag.vul{background:var(--yellow);color:var(--void)}
.pt-card .sub .tag.ep{color:var(--green);border:1px solid var(--green)}
.empty-state{padding:18px;text-align:center;color:var(--cream-muted);font-size:12px;font-style:italic}

main{padding:18px 22px 60px;overflow-y:auto;max-width:1240px;margin:0 auto;width:100%}

.disclaimer{background:rgba(122,24,24,0.20);border:1px solid var(--ox);border-left:3px solid var(--ox);border-radius:3px;padding:12px 16px;margin-bottom:18px;font-size:12px;color:var(--cream)}
.disclaimer strong{color:var(--brass)}

.section-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:14px;flex-wrap:wrap}
.section-h h2{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:0.01em}
.section-h .sub{font-family:var(--mono);font-size:11px;color:var(--cream-muted);letter-spacing:0.08em;text-transform:uppercase}
.section-h .actions{display:flex;gap:6px;flex-wrap:wrap}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--void-2);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
.card h3{font-family:var(--serif);font-size:14px;font-weight:600;margin-bottom:10px;color:var(--cream);letter-spacing:0.01em}
.card h3 .meta{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:0.1em;margin-left:8px}

.kpi{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line-soft);font-size:13px}
.kpi:last-child{border-bottom:none}
.kpi .l{color:var(--cream-dim)}
.kpi .v{font-family:var(--mono);color:var(--cream);font-weight:500}
.kpi .v.green{color:var(--green)}.kpi .v.red{color:var(--red)}.kpi .v.amber{color:var(--amber)}.kpi .v.brass{color:var(--brass)}.kpi .v.blue{color:var(--blue)}

.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.row.r3{grid-template-columns:1fr 1fr 1fr}
.row.r4{grid-template-columns:1fr 1fr 1fr 1fr}
.field label{display:block;font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:3px}
.field input,.field select,.field textarea{width:100%}
.field .hint{font-size:10px;color:var(--cream-muted);margin-top:3px;font-family:var(--mono)}

.btn{padding:7px 14px;border:1px solid var(--brass);border-radius:3px;font-size:12px;color:var(--cream);background:transparent;letter-spacing:0.04em;cursor:pointer}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn.primary{background:var(--ox);color:var(--cream);border-color:var(--ox);font-weight:600}
.btn.primary:hover{background:var(--ox-2);border-color:var(--ox-2);color:var(--cream)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:rgba(196,56,56,0.10)}
.btn.sm{padding:4px 9px;font-size:11px}
.btn.ghost{border-color:var(--line);color:var(--cream-dim)}
.btn.ghost:hover{border-color:var(--brass);color:var(--brass)}

table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
th{color:var(--brass);font-family:var(--mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600}
td.r{text-align:right;font-family:var(--mono)}
tr.total td{font-weight:600;border-top:1px solid var(--brass);border-bottom:none;padding-top:10px}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:var(--ink)}

.tag{display:inline-block;padding:2px 7px;border-radius:11px;font-family:var(--mono);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;border:1px solid var(--brass);color:var(--brass);margin-right:4px}
.tag.amber{border-color:var(--amber);color:var(--amber)}
.tag.green{border-color:var(--green);color:var(--green)}
.tag.red{border-color:var(--red);color:var(--red)}
.tag.blue{border-color:var(--blue);color:var(--blue)}
.tag.dim{border-color:var(--line);color:var(--cream-muted)}

.chat{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;padding:6px}
.msg{padding:10px 14px;border-radius:6px;max-width:88%;font-size:13px;line-height:1.55;white-space:pre-wrap}
.msg.user{background:var(--ink);align-self:flex-end;border-bottom-right-radius:2px}
.msg.bot{background:var(--void-2);border:1px solid var(--line);border-left:2px solid var(--ox);align-self:flex-start;border-bottom-left-radius:2px}
.msg.bot .src{font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.08em;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.chat-input{display:flex;gap:8px;margin-top:10px}
.chat-input input{flex:1;padding:11px 14px}

.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.subtabs button{padding:8px 14px;font-size:12px;color:var(--cream-dim);letter-spacing:0.04em;white-space:nowrap;border-bottom:2px solid transparent}
.subtabs button:hover{color:var(--cream)}
.subtabs button.active{color:var(--brass);border-bottom-color:var(--ox)}

.note-entry{background:var(--ink);border-left:3px solid var(--ox);border-radius:3px;padding:10px 12px;margin-bottom:8px}
.note-entry .hd{font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.06em;display:flex;justify-content:space-between;margin-bottom:6px}
.note-entry .hd .by{color:var(--brass)}
.note-entry .bd{font-size:13px;white-space:pre-wrap;font-family:var(--serif)}
.note-entry .hash{font-family:var(--mono);font-size:9px;color:var(--cream-muted);margin-top:6px;letter-spacing:0.04em;word-break:break-all}
.note-entry.correction{border-left-color:var(--amber)}

.cd-ledger{font-family:var(--mono);font-size:11px}
.cd-ledger .row-hd{display:grid;grid-template-columns:90px 80px 1fr 80px 80px 80px;gap:6px;padding:6px 0;border-bottom:1px solid var(--brass);color:var(--brass);font-size:10px;letter-spacing:0.06em;text-transform:uppercase}
.cd-ledger .row-it{display:grid;grid-template-columns:90px 80px 1fr 80px 80px 80px;gap:6px;padding:6px 0;border-bottom:1px dashed var(--line-soft);font-size:11px}
.cd-ledger .row-it .tx-received{color:var(--green)}
.cd-ledger .row-it .tx-dispensed{color:var(--amber)}
.cd-ledger .row-it .tx-destroyed{color:var(--red)}

.kloe-card{background:var(--void-2);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:10px}
.kloe-card h4{font-family:var(--serif);font-size:14px;color:var(--brass);margin-bottom:6px}
.kloe-card .rating{display:inline-block;padding:2px 8px;border-radius:3px;font-family:var(--mono);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;margin-left:8px}
.rating.outstanding{background:var(--green);color:var(--void)}
.rating.good{background:var(--blue);color:var(--cream)}
.rating.requires-improvement{background:var(--amber);color:var(--void)}
.rating.inadequate{background:var(--red);color:var(--cream)}
.rating.not-rated{background:var(--ink);color:var(--cream-muted);border:1px solid var(--line)}

.timeline{position:relative;padding-left:20px;border-left:2px solid var(--line)}
.timeline .ev{position:relative;padding:8px 0 8px 14px;font-size:12px}
.timeline .ev::before{content:'';position:absolute;left:-22px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--brass);border:2px solid var(--void)}
.timeline .ev .ts{font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.06em}
.timeline .ev .act{color:var(--cream);font-weight:600}
.timeline .ev .rzn{color:var(--cream-dim);font-size:11px;margin-top:2px;font-style:italic}

.alert-flag{background:rgba(196,56,56,0.15);border:1px solid var(--red);border-left:3px solid var(--red);padding:8px 12px;border-radius:3px;margin-bottom:8px;font-size:12px;color:var(--cream)}
.alert-flag.amber{background:rgba(204,122,31,0.12);border-color:var(--amber);border-left-color:var(--amber)}

.palette-bg,.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:flex-start;justify-content:center;padding-top:14vh;z-index:900;backdrop-filter:blur(4px)}
.palette-bg.open,.modal-bg.open{display:flex}
.modal-bg{align-items:center;padding:18px}
.palette{background:var(--void-2);border:1px solid var(--ox);border-radius:5px;width:min(640px,90%);box-shadow:0 18px 50px rgba(0,0,0,0.7);overflow:hidden}
.palette-hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.palette-hd .glyph{font-family:var(--serif);font-size:18px;color:var(--brass)}
.palette-hd input{flex:1;border:none;background:transparent;font-size:15px;padding:4px}
.palette-bd{max-height:50vh;overflow:auto;padding:8px}
.palette-row{padding:9px 12px;border-radius:3px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px}
.palette-row:hover{background:var(--ink)}
.modal{background:var(--void-2);border:1px solid var(--ox);border-radius:4px;padding:22px;max-width:680px;width:100%;max-height:90vh;overflow:auto}
.modal h2{font-family:var(--serif);font-size:17px;margin-bottom:14px}
.modal .actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ox);color:var(--cream);padding:9px 18px;border-radius:3px;font-family:var(--mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;font-weight:700;opacity:0;transition:all 0.22s;z-index:1100;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.onboard{max-width:580px;margin:5vh auto;padding:36px 32px;background:var(--void-2);border:1px solid var(--ox);border-radius:6px}
.onboard h1{font-family:var(--serif);font-size:28px;color:var(--brass);margin-bottom:6px}
.onboard .lead{color:var(--cream-dim);margin-bottom:20px;font-size:13px}
.onboard .step{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:0.18em;text-transform:uppercase;margin-bottom:8px}

.drawer-toggle{display:none;padding:0 12px;height:100%;align-items:center;border-right:1px solid var(--line);cursor:pointer;color:var(--brass);font-size:18px}

@media (max-width:880px){
  .drawer-toggle{display:flex}
  .layout{grid-template-columns:1fr}
  aside.sidebar{position:fixed;top:48px;left:-320px;bottom:0;width:300px;z-index:50;transition:left 0.2s;box-shadow:0 0 30px rgba(0,0,0,0.6)}
  aside.sidebar.open{left:0}
  nav.tabs button{padding:0 10px;font-size:11px}
  main{padding:14px 14px 50px}
  .row,.row.r3,.row.r4{grid-template-columns:1fr}
  .brand .seal{display:none}
  .cd-ledger .row-hd,.cd-ledger .row-it{grid-template-columns:1fr 1fr;font-size:10px}
}
</style>

  const MODALITIES = ['text', 'image', 'video', 'tts', 'stt'];
  const emptyKeys = () => ({ text: {}, image: {}, video: {}, tts: {}, stt: {} });
  /**
   * What a stored config holds, split into what may be stored (the tier, providers, models) and what is held in this
   * tab only (the keys). Keys stay stored only when the owner chose "remember my keys on this device"; a config written
   * the old way (keys stored, no choice made) has its keys moved into the tab and stored no longer. Pure.
   * → { config, secrets, moved } (moved: how many keys were taken out of storage)
   */
  function configFrom(c) {
    c = c && typeof c === 'object' && !Array.isArray(c) ? Object.assign({}, c) : {};
    if (c.api_key && !c.keys) {   // v1 → v2: one text key at the top level
      c.keys = emptyKeys();
      c.keys.text[c.api_provider || 'anthropic'] = { key: c.api_key, model: c.api_model };
    }
    delete c.api_key;
    const secrets = emptyKeys(), models = emptyKeys();
    let moved = 0;
    for (const m of MODALITIES) {
      const held = c.keys && c.keys[m] && typeof c.keys[m] === 'object' ? c.keys[m] : {};
      for (const pk of Object.keys(held)) {
        const e = held[pk] || {};
        if (typeof e.key === 'string' && e.key) { secrets[m][pk] = e.key; moved++; }
        if (typeof e.model === 'string' && e.model) models[m][pk] = e.model;
      }
      const kept = c.models && c.models[m] && typeof c.models[m] === 'object' ? c.models[m] : {};
      for (const pk of Object.keys(kept)) if (typeof kept[pk] === 'string' && kept[pk]) models[m][pk] = models[m][pk] || kept[pk];
    }
    c.models = models;
    const remember = c.remember_keys === true;
    if (!remember) delete c.keys;
    return { config: c, secrets: secrets, moved: remember ? 0 : moved };

  /** what is written to storage: the config, with the keys only if the owner chose to remember them. Pure. */
  function storedForm(config, secrets) {
    const out = Object.assign({}, config);

    if (config.remember_keys === true) {
      out.keys = emptyKeys();
      for (const m of MODALITIES) for (const pk of Object.keys(secrets[m] || {})) out.keys[m][pk] = { key: secrets[m][pk], model: (config.models && config.models[m] && config.models[m][pk]) || undefined };
    }

  // ═══════════════════════ TEXT · aiComplete · aiChat ═══════════════
  // One way to ask every text provider: the system prompt first and the same each call (so a provider can reuse its
  // reading of it), then the conversation, which only ever grows. Pure pieces (requestOf, textOf, usageOf) are exposed
  // on FallKit for tests; nothing pure here touches the network.
  const isObj = (x) => x !== null && typeof x === 'object' && !Array.isArray(x);
  const count = (x) => (Number.isInteger(x) && x >= 0 ? x : 0);
  /** Claude models from 5.x think before they answer: room for that, and a light effort for an assistant's reply */
  const THINKS = (model) => /^claude-(?:opus|sonnet|haiku|fable|mythos)-5/.test(model);
  /** Claude models with a server-side fallback when a request is declined (Haiku has none) */
  const FALLS_BACK = (model) => /^claude-(?:opus|sonnet|fable)-5/.test(model);
  /** a message's words, whatever shape a provider keeps it in */
  function wordsOf(m) {
    if (!isObj(m)) return '';
    if (typeof m.content === 'string') return m.content;
    if (Array.isArray(m.content)) return m.content.filter((b) => isObj(b) && b.type === 'text' && typeof b.text === 'string').map((b) => b.text).join('\n');
    return '';
  }
  /**
   * The request a text provider is sent: { url, headers, body } for type (anthropic | openai | google | openai_compat |
   * cohere | hf_inference). messages: [{ role: 'user' | 'assistant', content }]. Pure: the key is placed, never kept.
   */
  function requestOf(type, opts) {
    const { model, key, system, messages, maxTokens, url } = opts;
    const max = Number.isInteger(maxTokens) && maxTokens > 0 ? maxTokens : 600;
    const plain = messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: wordsOf(m) }));
    if (type === 'anthropic') {
      const headers = { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
      const body = { model, max_tokens: THINKS(model) ? Math.max(max * 4, 4000) : max, system: [{ type: 'text', text: system, cache_control: { type: 'ephemeral' } }],
        messages: messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content })) };
      if (THINKS(model)) body.output_config = { effort: 'low' };
      if (FALLS_BACK(model)) { headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; body.fallbacks = 'default'; }
      return { url: 'https://api.anthropic.com/v1/messages', headers, body };
    }
    if (type === 'openai') return { url: 'https://api.openai.com/v1/chat/completions', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_completion_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'google') return { url: 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', headers: { 'content-type': 'application/json', 'x-goog-api-key': key },
      body: { systemInstruction: { parts: [{ text: system }] }, contents: plain.map((m) => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })), generationConfig: { maxOutputTokens: max } } };
    if (type === 'cohere') return { url: 'https://api.cohere.com/v2/chat', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'hf_inference') return { url: 'https://api-inference.huggingface.co/models/' + model + '/v1/chat/completions', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'openai_compat') return { url: url, headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    return null;
  }
  /** the answer's words from a provider's reply, or null when it declined or said nothing. Pure. */
  function textOf(type, j) {
    if (!isObj(j)) return null;
    let t = '';
    if (type === 'anthropic') { if (j.stop_reason === 'refusal' || !Array.isArray(j.content)) return null; t = wordsOf({ content: j.content }); }
    else if (type === 'google') { const c = Array.isArray(j.candidates) ? j.candidates[0] : null; t = c && isObj(c.content) && Array.isArray(c.content.parts) ? c.content.parts.map((p) => (isObj(p) && typeof p.text === 'string' ? p.text : '')).join('') : ''; }
    else if (type === 'cohere') { t = isObj(j.message) && Array.isArray(j.message.content) ? wordsOf({ content: j.message.content.map((b) => Object.assign({ type: 'text' }, b)) }) : ''; }
    else { const c = Array.isArray(j.choices) ? j.choices[0] : null; t = c && isObj(c.message) && typeof c.message.content === 'string' ? c.message.content : ''; }
    t = t.trim();
    return t ? t : null;

  /** what a call used, read from a provider's own usage record: { read, recycled, written, out }. Pure. */
  function usageOf(type, j) {
    const u = isObj(j) ? (type === 'google' ? j.usageMetadata : type === 'cohere' && isObj(j.usage) ? j.usage.tokens : j.usage) : null;
    if (!isObj(u)) return { read: 0, recycled: 0, written: 0, out: 0 };
    if (type === 'anthropic') { const recycled = count(u.cache_read_input_tokens), written = count(u.cache_creation_input_tokens); return { read: count(u.input_tokens) + recycled + written, recycled, written, out: count(u.output_tokens) }; }
    if (type === 'google') { const read = count(u.promptTokenCount); return { read, recycled: Math.min(read, count(u.cachedContentTokenCount)), written: 0, out: count(u.candidatesTokenCount) + count(u.thoughtsTokenCount) }; }
    if (type === 'cohere') return { read: count(u.input_tokens), recycled: 0, written: 0, out: count(u.output_tokens) };
    const read = count(u.prompt_tokens), d = isObj(u.prompt_tokens_details) ? u.prompt_tokens_details : {};
    return { read, recycled: Math.min(read, count(d.cached_tokens)), written: 0, out: count(u.completion_tokens) };
  }

  async function aiComplete(systemPrompt, userMsg, maxTokens) {
    const r = await aiChat(systemPrompt, [], userMsg, maxTokens);
    return r ? r.text : null;
  }
  /**
   * One turn of a conversation: the system prompt, the history so far (unchanged), and the user's words. → { text,
   * assistant } — the caller appends { role: 'user', content: userMsg } and `assistant` to its history (assistant is the
   * reply as the provider gave it, so a provider that checks its own earlier turns sees them unchanged) — or null when no
   * tier can answer.
   */
  async function aiChat(systemPrompt, history, userMsg, maxTokens) {
    maxTokens = maxTokens || 600;
    const messages = (Array.isArray(history) ? history : []).concat([{ role: 'user', content: String(userMsg == null ? '' : userMsg) }]);
    const tier = aiTier();
    if (tier === 'T2' && STATE.ai.ready && STATE.ai.engine) {
      const r = await STATE.ai.engine.chat.completions.create({
        messages: [{ role: 'system', content: systemPrompt }].concat(messages.map((m) => ({ role: m.role, content: wordsOf(m) }))), max_tokens: maxTokens,
      });
      const text = r.choices[0].message.content;
      STATE.lastUsage = Object.assign({ provider: 'webllm' }, usageOf('openai', r));
      return { text: text, assistant: { role: 'assistant', content: text } };
    }
    if (tier === 'T3') {
      const p = activeTextProvider(); const key = getKey('text', p);
      if (!key) return null;
      return await textCall(p, systemPrompt, messages, maxTokens);
    }
    return null;
  }

  async function textCall(providerKey, sys, messages, maxTokens) {
    const p = TEXT_PROVIDERS[providerKey];
    const model = getModel('text', providerKey, TEXT_PROVIDERS);
    const req = requestOf(p.type, { model, key: getKey('text', providerKey), system: sys, messages, maxTokens, url: p.url });
    if (!req) throw new Error('unknown text provider type: ' + p.type);
    const r = await fetch(req.url, { method: 'POST', headers: req.headers, body: JSON.stringify(req.body) });
    if (!r.ok) throw new Error(p.label + ' ' + r.status);
    const j = await r.json();
    STATE.lastUsage = Object.assign({ provider: providerKey, model: model }, usageOf(p.type, j));
    const text = textOf(p.type, j);
    if (text === null) return null;
    return { text: text, assistant: p.type === 'anthropic' ? { role: 'assistant', content: j.content } : { role: 'assistant', content: text } };
  }

  // ═══════════════════════ ASK · about this page ═════════════════════
  // The kit's own use of the brain, so the chip is useful in any build, wired or not: a question about the page, answered
  // from the page's own words. The opening is read once per talk and sent byte-identical every question, so a provider
  // that caches recycles it; a talk starts afresh after MAX_ASKS questions or when the person starts again.
  const PAGE_MAX = 12000, MAX_ASKS = 20;
  const ASK_OPENING = 'You are the helper inside a web page. Answer questions about this page and how to use it, briefly and in plain words. Use only what the page says below; when it does not say, say so.';
  /** the opening for questions about a page: who the helper is, then the page's title, description and text. Pure. */
  function pageOpening(page) {
    const p = isObj(page) ? page : {};
    const line = (s, n) => (typeof s === 'string' ? s : '').replace(/\s+/g, ' ').trim().slice(0, n);
    const text = (typeof p.text === 'string' ? p.text : '').replace(/[ \t\r\f\v]+/g, ' ').replace(/ *\n[\s]*/g, '\n').trim().slice(0, PAGE_MAX);
    const about = line(p.description, 400);

  // ─── WebRTC P2P mesh ────────────────────────────────────────────────
  const MESH_CHANNEL = 'fall-signal';
  const MESH_MODULE = '/fall-kit/core/mesh.mjs', MESH_DEVICE = '/fall-kit/core/mesh-device.mjs';
  // v3.2: the LIGHT mesh, loaded from this origin when the mesh is switched on. null = JSON, as before v3.2.
  async function lightMesh() {
    try {
      const [M, D] = await Promise.all([import(MESH_MODULE), import(MESH_DEVICE)]);
      const dev = await D.openDevice();
      const tab = crypto.getRandomValues(new Uint32Array(1))[0];
      return { M, dev, tab, seq: 0, last: new Map() };
    } catch (e) { return null; }
  }
  function meshSend(value) {
    const L = STATE.mesh.light, bc = STATE.mesh.bc;
    if (!L) { bc.postMessage(value); STATE.mesh.stats.sent++; return; }
    L.seq += 1;
    L.M.speak(value, { slot: L.dev.slot, tab: L.tab, seq: L.seq, sign: L.dev.sign }).then((r) => { if (r.ok && STATE.mesh.bc) { STATE.mesh.bc.postMessage(r.bytes); STATE.mesh.stats.sent++; } });
  }
  async function meshStart(opts) {
    if (STATE.mesh.active) return;
    opts = opts || {};
    const seedId = opts.seedId || (location.pathname + '#' + Math.random().toString(36).slice(2, 8));
    STATE.mesh.seedId = seedId;
    try { STATE.mesh.bc = new BroadcastChannel(MESH_CHANNEL); }
    catch (e) { console.warn('fall-kit: BroadcastChannel unavailable'); return; }
    STATE.mesh.active = true;
    STATE.mesh.light = opts.light === false ? null : await lightMesh();
    const st = STATE.mesh.stats;
    STATE.mesh.bc.onmessage = async (e) => {
      const L = STATE.mesh.light;
      if (!L) {
        const m = e.data;
        if (!m || !m.kind || m.peerId === seedId) return;
        if (opts.onMessage) opts.onMessage(m);
        return;
      }
      const r = await L.M.hearMesh(e.data, { slot: L.dev.slot, id: L.dev.id, raw: L.dev.raw, verifyBytes: L.dev.verifyBytes, last: L.last });
      if (!r.ok) { st.refused[r.stage] = (st.refused[r.stage] || 0) + 1; return; }
      if (r.legacy) st.legacy++; else st.admitted++;
      if (r.value.peerId === seedId) return;
      if (opts.onMessage) opts.onMessage(Object.assign({}, r.value, r.legacy ? { legacy: true } : { light: true, tab: r.tab }));
    };
    meshSend({ kind: 'fall-kit:hello', peerId: seedId, ts: Date.now(), seedName: opts.seedName || 'unknown' });
    notify('Mesh active · channel ' + MESH_CHANNEL + (STATE.mesh.light ? ' · LIGHT' : ''), 'ok');
  }
  function meshPost(kind, payload) {
    if (!STATE.mesh.active || !STATE.mesh.bc) return false;
    meshSend({ kind: kind, peerId: STATE.mesh.seedId, ts: Date.now(), payload: payload });
    return true;
  }
  function meshStats() {
    const s = STATE.mesh.stats;
    return { active: STATE.mesh.active, light: !!STATE.mesh.light, tab: STATE.mesh.light ? STATE.mesh.light.tab : null, sent: s.sent, admitted: s.admitted, legacy: s.legacy, refused: Object.assign({}, s.refused) };
  }

  // control under the chip. Content that scrolls is not in the way.
  function blockerUnder(el) {

      const pos = getComputedStyle(e).position;

      if (bottom > innerHeight * 0.6) { chip.style.bottom = ''; chip.style.top = '14px'; return; }

  try{const tx=db.transaction(store,'readwrite');const s=tx.objectStore(store);const req=key?s.put(rec,key):s.put(rec);tx.oncomplete=()=>res();tx.onerror=()=>{lsPut(store,rec,key);res()};
  }catch(e){lsPut(store,rec,key);res()}
})}
function idbGet(store,key){return new Promise((res)=>{
  if(!db){return res(lsGet(store,key))}
  try{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).get(key);req.onsuccess=()=>res(req.result);req.onerror=()=>res(lsGet(store,key));
  }catch(e){res(lsGet(store,key))}
})}
function idbAll(store){return new Promise((res)=>{
  if(!db){return res(lsAll(store))}
  try{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).getAll();req.onsuccess=()=>res(req.result||[]);req.onerror=()=>res(lsAll(store));
  }catch(e){res(lsAll(store))}
})}
function idbDel(store,key){return new Promise((res)=>{
  if(!db){lsDel(store,key);return res()}
  try{const tx=db.transaction(store,'readwrite');const req=tx.objectStore(store).delete(key);tx.oncomplete=()=>res();tx.onerror=()=>{lsDel(store,key);res()};
  }catch(e){lsDel(store,key);res()}
})}
const LSKEY=k=>STORE+'::'+k;
function lsPut(s,r,k){try{const all=JSON.parse(localStorage.getItem(LSKEY(s))||'{}');all[k||r.id]=r;localStorage.setItem(LSKEY(s),JSON.stringify(all))}catch(e){}}
function lsGet(s,k){try{const all=JSON.parse(localStorage.getItem(LSKEY(s))||'{}');return all[k]}catch(e){return null}}
function lsAll(s){try{return Object.values(JSON.parse(localStorage.getItem(LSKEY(s))||'{}'))}catch(e){return[]}}
function lsDel(s,k){try{const all=JSON.parse(localStorage.getItem(LSKEY(s))||'{}');delete all[k];localStorage.setItem(LSKEY(s),JSON.stringify(all))}catch(e){}}

}

//
// ⚑ SCOPED IN A CLOSURE ON PURPOSE. The kernel exports names the app also uses (clinicianFlags,
// cdBalance…) with DIFFERENT signatures. Left at top level, the later declaration would silently win
// and every call site would be passing the wrong arguments to a function that still looked right.
// Do not edit between the markers: edit clinic.mjs, re-run the gate, then rebuild the page.

const K = (function(){
/* __CLINIC_KERNEL__ */
// clinic.mjs — the parts of fallclinic where being wrong hurts somebody.
//
// Lifted OUT of index.html unchanged in behaviour, not rewritten: the page imports these, so the code
// the gate attacks is the code that runs. Everything here is pure — the clock and the hash are handed
// in — because a function that reads Date.now() cannot be tested at a boundary, and every rule below
// IS a boundary.
//
// What is gated and why it matters:
//   · interactions   a missed pair is patient harm
//   · CD register    the controlled-drug balance is a statutory record
//   · expiry flags   an expired indemnity or revalidation means someone is practising uncovered
//   · audit chain    a tamper-evident log nobody can verify is decoration

// ── time ─────────────────────────────────────────────────────────────────────────────────────────
const DAY = 24 * 3600 * 1000;

/** Whole days from `now` until `ts`. Negative means it has already gone by. */
function daysFromNow(ts, now) {
  if (!ts) return null;
  const t = Number(now);
  if (!Number.isFinite(t)) return null;
  return Math.floor((Number(ts) - t) / DAY);
}

/** Age in whole years, birthday-aware — someone born on 29 Feb is not a year older on 28 Feb. */
function ageFromDob(dob, now) {
  if (!dob) return null;
  const d = new Date(dob);
  const a = new Date(Number(now));
  if (Number.isNaN(d.getTime()) || Number.isNaN(a.getTime())) return null;
  let age = a.getFullYear() - d.getFullYear();
  const m = a.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && a.getDate() < d.getDate())) age--;
  return age;
}

// ── who is safe to practise ──────────────────────────────────────────────────────────────────────
// RED means stop; AMBER means it is coming. The thresholds are the ones the app already used:
// revalidation 90 days, indemnity 30 days, appraisal annually.
const REVALIDATION_WARN_DAYS = 90;
const INDEMNITY_WARN_DAYS = 30;
const APPRAISAL_PERIOD_DAYS = 365;

function clinicianFlags(c, now) {
  const f = [];
  if (!c) return f;
  const r = daysFromNow(c.revalidationDue, now);
  if (r !== null && r < 0) f.push({ sev: 'red', msg: 'Revalidation overdue' });
  else if (r !== null && r < REVALIDATION_WARN_DAYS) f.push({ sev: 'amber', msg: 'Revalidation due in ' + r + 'd' });

  const a = c.appraisalLastAt ? daysFromNow(c.appraisalLastAt + APPRAISAL_PERIOD_DAYS * DAY, now) : null;
  if (a !== null && a < 0) f.push({ sev: 'amber', msg: 'Annual appraisal overdue' });

  const ix = daysFromNow(c.indemnityExpiry, now);
  if (ix !== null && ix < 0) f.push({ sev: 'red', msg: 'Indemnity expired' });
  else if (ix !== null && ix < INDEMNITY_WARN_DAYS) f.push({ sev: 'amber', msg: 'Indemnity in ' + ix + 'd' });
  return f;
}

function firmFlags(f, now) {

  if (!f) return out;
  const ix = daysFromNow(f.piExpiresAt, now);
  if (ix !== null && ix < 0) out.push({ sev: 'red', msg: 'Clinic PII expired' });
  else if (ix !== null && ix < INDEMNITY_WARN_DAYS) out.push({ sev: 'amber', msg: 'Clinic PII in ' + ix + 'd' });

function patientFlags(p, openEpisodes, now) {

  if (p.vulnerabilityFlag) f.push({ sev: 'amber', msg: 'Vulnerable patient flag' });

// ── drug interactions ────────────────────────────────────────────────────────────────────────────
// ⚑ NOT EXHAUSTIVE, AND IT SAYS SO. This is a short BNF-shaped list, not the BNF. It is a prompt to
// check, never a clearance to prescribe — `exhaustive: false` rides on every result so no caller can
// render a clean check as "no interactions exist".
const INTERACTIONS = [
  ['warfarin', 'aspirin', 'SEVERE', 'Increased bleeding risk · INR'],
  ['warfarin', 'ibuprofen', 'SEVERE', 'GI bleeding risk · avoid'],
  ['warfarin', 'amiodarone', 'SEVERE', 'Potentiates warfarin · halve dose'],
  ['warfarin', 'clarithromycin', 'SEVERE', 'Raises INR significantly'],
  ['warfarin', 'metronidazole', 'SEVERE', 'Raises INR'],
  ['warfarin', 'fluconazole', 'MODERATE', 'Raises INR'],
  ['warfarin', 'paracetamol', 'MODERATE', 'Prolonged use may raise INR'],
  ['methotrexate', 'trimethoprim', 'SEVERE', 'Profound marrow suppression · avoid'],
  ['simvastatin', 'clarithromycin', 'SEVERE', 'Rhabdomyolysis risk · suspend statin'],
  ['lithium', 'ibuprofen', 'SEVERE', 'Raises lithium to toxic levels'],
  ['lithium', 'ramipril', 'SEVERE', 'Raises lithium levels'],
  ['ciprofloxacin', 'theophylline', 'SEVERE', 'Theophylline toxicity'],
  ['sildenafil', 'isosorbide', 'SEVERE', 'Profound hypotension · contraindicated'],
  ['spironolactone', 'ramipril', 'MODERATE', 'Hyperkalaemia · check U&E'],
  ['digoxin', 'amiodarone', 'SEVERE', 'Digoxin toxicity · halve dose'],
];

/** A name is only comparable once it is trimmed and lowercased. Empty means "no name given". */
const norm = (s) => String(s == null ? '' : s).trim().toLowerCase();

/**
 * Ordering for the alert list. A named function rather than an inline ternary, because the gate
 * showed the inline version could be mutated without any test noticing — the severe pairs happened
 * to already be first in the table, so a broken comparator looked identical to a working one.
 * Anything unrecognised sorts LAST but is never dropped.
 */
function severityRank(sev) {
  const s = String(sev == null ? '' : sev).toUpperCase();
  if (s === 'SEVERE') return 0;
  if (s === 'MODERATE') return 1;
  return 2;
}

/**
 * ⚑ THE EMPTY-STRING TRAP. The original matched each way round with `includes`, and EVERY string
 * contains the empty string — so one blank medication row made every drug on the list look like an
 * interaction. Blanks are dropped before matching, and a blank query returns nothing.
 *
 * Matching is on whole words rather than bare substrings for the same reason: "a" must not match
 * "aspirin", or a one-character typo raises a severe alert on a drug nobody is taking.
 */
function mentions(haystack, drug) {
  const h = norm(haystack), d = norm(drug);
  if (!h || !d) return false;
  if (h === d) return true;
  // word-boundary containment, either direction, so "warfarin sodium" still matches "warfarin"
  const words = h.split(/[^a-z0-9]+/).filter(Boolean);
  return words.includes(d);
}

/**
 * Interactions between a proposed drug and everything the patient is already on.
 * `currentDrugs` is the caller's list — regular medications plus live prescriptions.
 */
function checkInteractions(currentDrugs, proposed) {
  const p = norm(proposed);
  const found = [];
  if (!p) return { interactions: found, checked: 0, exhaustive: false };
  const taking = (Array.isArray(currentDrugs) ? currentDrugs : [])
    .map(m => (m && typeof m === 'object') ? m.name : m)
    .map(norm)
    .filter(Boolean);

  for (const [a, b, sev, note] of INTERACTIONS) {
    let other = null;
    if (mentions(p, a)) other = b;
    else if (mentions(p, b)) other = a;
    if (!other) continue;
    if (taking.some(m => mentions(m, other))) found.push({ a: proposed, b: other, sev, note });
  }
  // Severe first: an alert list a prescriber scrolls is an alert list a prescriber misses.
  found.sort((x, y) => severityRank(x.sev) - severityRank(y.sev));
  return { interactions: found, checked: taking.length, exhaustive: false };
}

// ── the controlled-drug register ─────────────────────────────────────────────────────────────────
// A statutory running balance. Every movement is one of these, and nothing else counts.
const CD_IN = ['received'];
const CD_OUT = ['supplied', 'administered', 'destroyed', 'returned'];

/**
 * ⚑ AN UNKNOWN MOVEMENT IS REFUSED, NOT GUESSED. The original subtracted for anything that was not
 * 'received', so a typo in `tx` silently removed stock from a legally-required register. Here an
 * unrecognised movement is REPORTED and excluded, and the balance says it is not trustworthy —
 * a controlled-drug balance that is quietly wrong is worse than one that admits it cannot be computed.
 */
function cdBalance(register, drug) {
  const want = norm(drug);
  let balance = 0, moves = 0;
  const rejected = [];
  for (const e of (Array.isArray(register) ? register : [])) {
    if (!e || norm(e.drug) !== want || !want) continue;
    const q = Number(e.qty);
    if (!Number.isFinite(q) || q < 0) { rejected.push({ id: e.id ?? null, why: 'quantity is not a positive number' }); continue; }
    const tx = norm(e.tx);
    if (CD_IN.includes(tx)) { balance += q; moves++; }
    else if (CD_OUT.includes(tx)) { balance -= q; moves++; }
    else rejected.push({ id: e.id ?? null, why: `unrecognised movement "${e.tx}"` });
  }
  return { drug, balance, moves, rejected, trustworthy: rejected.length === 0 };
}

function cdUniqueDrugs(register) {
  const seen = new Set();
  for (const e of (Array.isArray(register) ? register : [])) {
    const d = e && String(e.drug || '').trim();
    if (d) seen.add(d);
  }
  return [...seen].sort();
}

// ── the audit chain ──────────────────────────────────────────────────────────────────────────────
/**
 * The bytes that get hashed for one entry. Kept as its own function so the writer and the verifier
 * can never disagree about what was signed — which is the only way a chain check means anything.
 */
function auditPayload(prevHash, entry) {
  const e = (entry && typeof entry === 'object') ? entry : {};
  return String(prevHash == null ? '' : prevHash)
    + String(e.ts ?? '')
    + String(e.action ?? '')
    + String(e.clinicianId ?? '')
    + String(e.patientId ?? '')
    + JSON.stringify(e.payload ?? {});
}

/**
 * ⚑ THE CHAIN WAS WRITTEN BUT NEVER CHECKED. index.html built prevHash/docHash on every entry and
 * nothing ever re-walked them, so the tamper-evidence was a claim rather than a property. This walks
 * the log and names the FIRST entry that does not reproduce — the earliest break is the one that
 * tells you when the tampering happened; later mismatches are just its wake.
 *
 * `sha256` is injected (async) so this stays pure and testable without WebCrypto.
 */
async function verifyAuditChain(entries, sha256) {
  const log = Array.isArray(entries) ? entries : [];
  if (typeof sha256 !== 'function') throw new Error('verifyAuditChain needs a sha256(string) function');
  let prev = '';
  for (let i = 0; i < log.length; i++) {
    const e = log[i] || {};
    if (String(e.prevHash ?? '') !== prev) {
      return { ok: false, brokeAt: i, id: e.id ?? null, reason: 'prevHash does not match the entry before it' };
    }
    const expected = await sha256(auditPayload(prev, e));
    if (expected !== e.docHash) {
      return { ok: false, brokeAt: i, id: e.id ?? null, reason: 'entry was altered after it was written' };
    }
    prev = e.docHash;
  }
  return { ok: true, entries: log.length, reason: log.length ? 'every entry reproduces its own hash' : 'the log is empty' };
}


/* __END_CLINIC_KERNEL__ */
return {daysFromNow,ageFromDob,clinicianFlags,firmFlags,patientFlags,mentions,
        checkInteractions,cdBalance,cdUniqueDrugs,severityRank,auditPayload,verifyAuditChain};
})();

// ════════════════════════════════════════════════════════════════
// ⚑ THESE ARE ADAPTERS, NOT LOGIC. Every rule below lives in the gated kernel (see the marker
// further down). These functions only hand it the app's state and the clock, so that the code a
// clinician relies on is the exact code the mutation gate attacked — not a copy of it that can drift.
// ════════════════════════════════════════════════════════════════
function clinicianFlags(c){return K.clinicianFlags(c,Date.now())}
function firmFlags(f){return K.firmFlags(f,Date.now())}
function patientFlags(p){return K.patientFlags(p,p?activePatientEpisodes(p).length:0,Date.now())}

function checkInteractions(patient,newRxName){
  if(!patient)return [];
  const meds=(patient.regularMedications||[]).map(m=>typeof m==='string'?m:m&&m.name);
  const existing=patientPrescriptions(patient).map(r=>r.drug);
  // The kernel returns { interactions, checked, exhaustive }. Callers here want the list, and the
  // exhaustive:false is surfaced in the UI copy beside it — never dropped silently.
  return K.checkInteractions([...meds,...existing],newRxName).interactions;
}

function cdBalance(drug){
  const r=K.cdBalance(state.cdRegister,drug);
  // ⚑ A REGISTER THAT CANNOT BE TRUSTED SAYS SO. The old version silently subtracted for any
  // unrecognised movement, so one typo quietly removed controlled stock from a statutory record.
  if(!r.trustworthy&&typeof toast==='function')toast('CD register: '+r.rejected.length+' entr'+(r.rejected.length===1?'y':'ies')+' not counted — check the register');
  return r.balance;
}
function cdBalanceDetail(drug){return K.cdBalance(state.cdRegister,drug)}
function cdUniqueDrugs(){return K.cdUniqueDrugs(state.cdRegister)}

// The audit chain was written on every action and never once checked, which made it a claim rather
// than a property. This is the check.
async function verifyAudit(){return K.verifyAuditChain(state.audit,sha256)}
